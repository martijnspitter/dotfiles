unbind r
bind r source-file ~/.tmux.conf

set -g base-index 1
set -g mouse on

set-window-option -g mode-keys vi
set-option -g status-position top

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'

# vim-like pane switching
bind -r ^ last-window
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# forget the find window.  That is for chumps
bind-key -r f run-shell "tmux neww ~/dotfiles/tmux-sessionizer.sh"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'

# --- Catppuccin (v1.x API) ---
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'

# Inactive vs active window label — both show the window name (#W), not the path (#T default)
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'

# Match the bar background to the terminal (mocha base #1e1e2e) instead of the
# default mantle (#181825) — fixes the dark gaps and lets rounded corners blend
set -g @catppuccin_status_background '#{@thm_bg}'

set -g @catppuccin_status_connect_separator 'no'
set -g @catppuccin_directory_text '#{pane_current_path}'

set-option -sg escape-time 10

# Initialize TMUX plugin manager (keep this line near the bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Catppuccin copies the rounded separators to the *current* window with `-o`
# (only-if-unset), so a pre-existing default blocks them and the selected
# window loses its rounding. Force-copy them after tpm loads to fix that.
set -gF @catppuccin_window_current_left_separator "#{@catppuccin_window_left_separator}"
set -gF @catppuccin_window_current_right_separator "#{@catppuccin_window_right_separator}"

# Status line — built from catppuccin modules; must come AFTER tpm loads them
set -g status-left ''
set -g status-right-length 100
set -g status-right '#{E:@catppuccin_status_directory}'
set -agF status-right '#{E:@catppuccin_status_user}'
set -ag status-right '#{E:@catppuccin_status_session}'
