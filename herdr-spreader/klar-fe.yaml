# herdr-spreader layout template - klar-fe (with proxy + dev server)
# Rendered via envsubst by ~/dotfiles/herdr-sessionizer.sh
# Placeholders:
#   ${SESSION_NAME}  workspace name
#   ${QUERY}         absolute path to the project root
workspaces:
  - name: ${SESSION_NAME}
    root: ${QUERY}
    focus: true
    tabs:
      - label: pi
        panes:
          - command: pi
            focus: true
      - label: editor
        panes:
          - command: nvim
      - label: git
        panes:
          - command: lazygit
      - label: terminal
        panes:
          - {}
          - split: right
            ratio: 0.5
      - label: server
        panes:
          # Left pane: klar-proxy-prod via docker compose in ./proxy.
          # - Uses `;` between cd and docker so a missing ./proxy does
          #   NOT silently abort the whole chain (which was the previous
          #   "nothing happens" behavior).
          # - Echoes each stage so we always see what fired.
          # - Wrapped in `sh -c` so the whole conditional is one payload
          #   sent to the pane, avoiding multi-line paste quirks.
          - command: "sh -c 'echo \"[server] cd ./proxy\"; cd proxy || { echo \"[server] no ./proxy in $PWD\"; exit 1; }; echo \"[server] checking klar-proxy-prod...\"; if docker compose ps --status running --format \"{{.Name}}\" | grep -qx klar-proxy-prod; then echo \"[server] attaching (ctrl-p ctrl-q to detach)\"; docker compose attach klar-proxy-prod; else echo \"[server] starting klar-proxy-prod...\"; docker compose up klar-proxy-prod; fi'"
          # Right pane: vite dev server via `pnpm start`.
          - split: right
            ratio: 0.5
            command: "echo '[dev] pnpm start'; pnpm start"
